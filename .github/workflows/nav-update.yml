name: Update navigation labels

on:
  push:
    paths:
      - '.github/workflows/nav-update.yml'

permissions:
  contents: write

jobs:
  update-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'index.html': (
                  '<div class="navlinks"><a href="#about">About</a><a href="services.html">How We Work</a><a href="#experience">Where We Work</a><a href="mailto:robert.alex.thompson@gmail.com">Contact</a></div>',
                  '<div class="navlinks"><a href="#about">About / Contact</a><a href="services.html">How We Work</a><a href="#experience">Where We Work</a></div>'
              ),
              'services.html': (
                  '<div class="navlinks"><a href="index.html#about">About</a><a class="active" href="services.html">How We Work</a><a href="index.html#experience">Where We Work</a><a href="mailto:robert.alex.thompson@gmail.com">Contact</a></div>',
                  '<div class="navlinks"><a href="index.html#about">About / Contact</a><a class="active" href="services.html">How We Work</a><a href="index.html#experience">Where We Work</a></div>'
              )
          }

          for filename, (old, new) in replacements.items():
              p = Path(filename)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected navigation block not found in {filename}')
              p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html services.html
          git commit -m "Combine About and Contact navigation" || exit 0
          git push origin main
