<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Dendro Analytics</title><style>:root{--paper:#070807;--ink:#f0ede5;--muted:#b6b5ae;--green:#a9b88a;--line:#2a2d29;--serif:Baskerville,"Iowan Old Style",Palatino,Georgia,serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070807;color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;display:grid;place-items:center}.gate{width:min(440px,calc(100% - 40px));text-align:center}.mark{font-family:var(--serif);font-size:82px;line-height:.9;letter-spacing:-.055em;margin-bottom:24px}.mark span{color:var(--green)}.name{font-family:var(--serif);font-size:20px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:52px}.gate p{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 16px}.row{display:flex;gap:10px}input{min-width:0;flex:1;background:#0d0f0d;border:1px solid #343934;color:var(--ink);padding:13px 14px;font:inherit;outline:none;border-radius:3px}input:focus{border-color:var(--green)}button{background:transparent;border:1px solid var(--green);color:var(--green);padding:12px 18px;text-transform:uppercase;letter-spacing:.12em;font-size:10px;border-radius:3px;cursor:pointer}button:hover{background:var(--green);color:#070807}.error{height:22px;margin-top:10px!important;color:#c6a59a!important;font-size:10px!important}.note{margin-top:38px!important;color:#6f746d!important;font-size:9px!important}</style></head><body><main class="gate"><div class="mark">D<span>/</span>A</div><div class="name">Dendro Analytics</div><p>Site preview</p><form id="gate"><div class="row"><input id="pw" type="password" autocomplete="current-password" aria-label="Password" placeholder="Password" autofocus><button type="submit">Enter</button></div><p class="error" id="err"></p></form><p class="note">Website currently under development.</p></main><script>const target='site.html';document.getElementById('gate').addEventListener('submit',function(e){e.preventDefault();if(document.getElementById('pw').value==='hearts1'){sessionStorage.setItem('dendro-preview','1');location.href=target}else{document.getElementById('err').textContent='Incorrect password.'}});</script></body></html>
